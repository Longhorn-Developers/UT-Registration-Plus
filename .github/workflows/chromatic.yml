name: 'Chromatic'
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: chpt_473b096f047c856 # bleh, but not really that a "secret", and necessary to expose for forks to build on chromatic
          exitZeroOnChanges: true
          autoAcceptChanges: 'main'
