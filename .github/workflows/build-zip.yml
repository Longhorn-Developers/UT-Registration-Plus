name: Build ZIP
# Builds the extension on every PR and push to main, and attaches the dist folder as a
# downloadable artifact so testers can load it unpacked without running pnpm locally.
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: build-zip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build extension
        run: pnpm build
      - name: Set artifact name
        id: name
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=utrp-pr-${{ github.event.pull_request.number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "value=utrp-main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: dist
          if-no-files-found: error
      - name: Write tester instructions
        run: |
          {
            echo "## Test this build"
            echo
            echo "1. Download **${{ steps.name.outputs.value }}** from the Artifacts section at the bottom of this page."
            echo "2. Extract the ZIP."
            echo "3. Open \`chrome://extensions\`, turn on Developer mode, click **Load unpacked**, and pick the extracted folder."
            echo
            echo "If a store version of UTRP is installed, disable it first so the two don't conflict."
          } >> "$GITHUB_STEP_SUMMARY"
